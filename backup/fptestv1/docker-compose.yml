version: '3.8'

services:
  fastapi-planner:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fastapi-planner-service
    network_mode: host
    environment:
      # ROS Configuration
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_IP=127.0.0.1
      - ROS_HOSTNAME=localhost
      
      # FastAPI Service Configuration
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - LOG_LEVEL=info
      
      # Configuration File Path
      - CONFIG_FILE=/root/catkin_ws/fastapi_planner/config.yaml
    
    volumes:
      # Mount the workspace for development
      - ./src:/root/catkin_ws/src
      - ./fastapi_planner:/root/catkin_ws/fastapi_planner
      - ./devel:/root/catkin_ws/devel
      - ./build:/root/catkin_ws/build
    
    working_dir: /root/catkin_ws
    
    # Keep container running
    stdin_open: true
    tty: true
    
    command: >
      bash -c "
        source /opt/ros/noetic/setup.bash &&
        if [ -f /root/catkin_ws/devel/setup.bash ]; then
          source /root/catkin_ws/devel/setup.bash
        fi &&
        echo 'Starting FastAPI-Fast-Planner Interface...' &&
        cd /root/catkin_ws &&
        python3 -m fastapi_planner.main
      "
    
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

